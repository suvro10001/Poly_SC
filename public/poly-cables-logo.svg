<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1235 220" width="1235" height="220">
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- 1. Official 4-Circle Chromatic Emblem (Left) -->
  <g transform="translate(8, 10)">
    <defs>
      <clipPath id="cyan-core-clip">
        <circle cx="100" cy="100" r="64" />
      </clipPath>
    </defs>

    <!-- Central Sky Blue Disc -->
    <circle cx="100" cy="100" r="64" fill="#46b4eb" />

    <!-- Top: Golden Yellow Disc -->
    <circle cx="100" cy="35" r="30" fill="#eab318" />
    <g clip-path="url(#cyan-core-clip)">
      <circle cx="100" cy="35" r="30" fill="#c9ae3b" />
    </g>

    <!-- Left: Leaf Green Disc -->
    <circle cx="35" cy="100" r="30" fill="#47ae4c" />
    <g clip-path="url(#cyan-core-clip)">
      <circle cx="35" cy="100" r="30" fill="#53b36b" />
    </g>

    <!-- Right: Deep Navy Blue Disc -->
    <circle cx="165" cy="100" r="30" fill="#1d2b78" />
    <g clip-path="url(#cyan-core-clip)">
      <circle cx="165" cy="100" r="30" fill="#253b8e" />
    </g>

    <!-- Bottom: Crimson Red Disc -->
    <circle cx="100" cy="165" r="30" fill="#c8151d" />
    <g clip-path="url(#cyan-core-clip)">
      <circle cx="100" cy="165" r="30" fill="#bd5654" />
    </g>
  </g>

  <!-- 2. Typography: P [Red Brush Spiral O] LY CABLES -->
  <!-- Using geometric vector paths & precise textLength so no letter is ever clipped -->
  <g fill="#1b287c" font-family="'Arial Black', 'Montserrat', 'Helvetica Neue', Impact, sans-serif" font-weight="900">
    <!-- Letter P -->
    <path d="M 230 62 H 278 C 302 62 316 74 316 95 C 316 116 302 129 278 129 H 256 V 156 H 230 V 62 Z M 256 82 V 109 H 274 C 284 109 290 104 290 95.5 C 290 87 284 82 274 82 H 256 Z" />

    <!-- Authentic Red Brush-Stroke Spiral "O" -->
    <g transform="translate(374, 109)">
      <path
        d="M 38 -25
           C 22 -48, -14 -54, -36 -34
           C -56 -16, -56 20, -34 39
           C -14 56, 22 54, 41 32
           C 48 23, 50 11, 47 2
           C 45 12, 40 22, 31 29
           C 14 43, -14 43, -29 27
           C -42 13, -41 -12, -26 -25
           C -12 -37, 12 -35, 25 -16
           Z"
        fill="#c32126"
      />
      <path
        d="M -32 36 C -12 52, 22 50, 39 30 C 45 22, 48 11, 46 1"
        fill="none"
        stroke="#c32126"
        stroke-width="3.5"
        stroke-linecap="round"
      />
      <path
        d="M 16 -14
           C 6 -27, -14 -28, -24 -16
           C -33 -5, -31 13, -19 22
           C -7 31, 12 29, 22 17
           C 28 9, 29 -2, 25 -10
           C 24 -2, 20 7, 13 13
           C 4 20, -9 20, -16 12
           C -23 4, -22 -7, -14 -14
           C -7 -20, 4 -19, 10 -10
           Z"
        fill="#c32126"
      />
      <path
        d="M -16 20 C -4 28, 13 26, 21 14 C 26 6, 26 -5, 21 -12"
        fill="none"
        stroke="#c32126"
        stroke-width="2.5"
        stroke-linecap="round"
      />
      <path
        d="M -11 -11
           A 15 15 0 1 1 -3 14
           L -7 6
           A 7 7 0 1 0 -12 2
           L -19 5
           A 15 15 0 0 1 -11 -11 Z"
        fill="#c32126"
      />
    </g>

    <!-- Letter L -->
    <path d="M 436 62 H 462 V 134 H 506 V 156 H 436 V 62 Z" />

    <!-- Letter Y -->
    <path d="M 502 62 H 531 L 551 98 L 571 62 H 599 L 564 120 V 156 H 538 V 120 L 502 62 Z" />

    <!-- Letter C -->
    <path d="M 716 123 L 740 131 C 735 148 719 158 696 158 C 665 158 645 138 645 109 C 645 80 665 60 696 60 C 720 60 736 71 741 88 L 716 95 C 713 86 706 81 696 81 C 679 81 671 92 671 109 C 671 126 679 137 696 137 C 706 137 713 132 716 123 Z" />

    <!-- Letter A -->
    <path d="M 784 62 H 813 L 849 156 H 822 L 815 137 H 781 L 774 156 H 748 L 784 62 Z M 788 117 H 808 L 798 88 L 788 117 Z" />

    <!-- Letter B -->
    <path d="M 858 62 H 908 C 927 62 939 71 939 86 C 939 96 933 103 923 106 C 936 109 943 118 943 130 C 943 147 930 156 908 156 H 858 V 62 Z M 884 81 V 99 H 903 C 911 99 915 95 915 90 C 915 84 911 81 903 81 H 884 Z M 884 117 V 137 H 905 C 914 137 918 133 918 127 C 918 121 914 117 905 117 H 884 Z" />

    <!-- Letter L -->
    <path d="M 957 62 H 983 V 134 H 1028 V 156 H 957 V 62 Z" />

    <!-- Letter E -->
    <path d="M 1040 62 H 1114 V 83 H 1066 V 98 H 1109 V 118 H 1066 V 135 H 1116 V 156 H 1040 V 62 Z" />

    <!-- Letter S (x=1126 to 1208 -> fits cleanly inside viewBox) -->
    <path d="M 1125 126 L 1150 124 C 1152 134 1159 139 1171 139 C 1181 139 1187 135 1187 129 C 1187 123 1181 121 1166 118 C 1144 113 1129 106 1129 88 C 1129 71 1144 60 1169 60 C 1194 60 1208 71 1210 89 L 1185 91 C 1183 83 1178 79 1168 79 C 1159 79 1154 82 1154 87 C 1154 93 1160 95 1175 98 C 1198 103 1213 110 1213 128 C 1213 147 1197 158 1170 158 C 1142 158 1127 146 1125 126 Z" />
  </g>
</svg>
