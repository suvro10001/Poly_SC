<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 70">
  <defs>
    <linearGradient id="logoRedGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <!-- Left Emblem -->
  <g transform="translate(6, 0)">
    <!-- Central Cyan Circle -->
    <circle cx="36" cy="35" r="18" fill="#38bdf8" />
    <!-- 4 Satellite Conductors -->
    <circle cx="36" cy="14" r="9.5" fill="#facc15" fill-opacity="0.92" />
    <circle cx="15" cy="35" r="9.5" fill="#22c55e" fill-opacity="0.92" />
    <circle cx="57" cy="35" r="9.5" fill="#1d4ed8" fill-opacity="0.92" />
    <circle cx="36" cy="56" r="9.5" fill="#dc2626" />
    <path d="M 29 59 C 32 63.5, 40 63.5, 43 59 C 41 61.2, 31 61.2, 29 59 Z" fill="url(#logoRedGloss)" />
  </g>

  <!-- Wordmark Text "P" -->
  <text x="82" y="48" fill="#1a2868" font-family="system-ui, -apple-system, 'Arial Black', Montserrat, sans-serif" font-weight="900" font-size="37" letter-spacing="-0.02em">P</text>

  <!-- Stylized Red Concentric Circular Coil "O" -->
  <g transform="translate(136, 35)">
    <!-- Outer concentric ring -->
    <circle cx="0" cy="0" r="14" fill="none" stroke="#c52227" stroke-width="4.5" />
    <!-- Middle concentric ring -->
    <circle cx="0" cy="0" r="7.8" fill="none" stroke="#c52227" stroke-width="3" />
    <!-- Center red coil core -->
    <circle cx="0" cy="0" r="2.8" fill="#c52227" />
    <path d="M 0 0 C 1 1.6, 2.8 1.2, 3.5 -0.8" stroke="#c52227" stroke-width="1.8" stroke-linecap="round" fill="none" />
  </g>

  <!-- Wordmark Text "LY CABLES" -->
  <text x="160" y="48" fill="#1a2868" font-family="system-ui, -apple-system, 'Arial Black', Montserrat, sans-serif" font-weight="900" font-size="37" letter-spacing="-0.01em">LY CABLES</text>
</svg>
