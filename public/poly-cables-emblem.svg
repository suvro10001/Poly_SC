    <!-- Bottom: Crimson Red Disc -->
    <circle cx="105" cy="166" r="31" fill="#c8151d" />
    <g clip-path="url(#cyan-core-clip-emblem)">
      <circle cx="105" cy="166" r="31" fill="#bd5654" />
