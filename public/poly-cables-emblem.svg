    </g>

    <!-- Right: Deep Navy Blue Disc -->
    <circle cx="172" cy="100" r="31" fill="#1d2b78" />
    <g clip-path="url(#cyan-core-clip-emblem)">
      <circle cx="172" cy="100" r="31" fill="#253b8e" />
