<svg width="64" height="64" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="favCenterClip">
      <circle cx="50" cy="50" r="27.5" />
    </clipPath>
  </defs>

  <!-- Central Sky Blue Circle -->
  <circle cx="50" cy="50" r="27.5" fill="#29B6F6" />

  <!-- 4 Outer Cable Insulation Color Circles: Yellow, Blue, Red, Green -->
  <circle cx="50" cy="22" r="16.5" fill="#FACC15" />
  <circle cx="78" cy="50" r="16.5" fill="#2563EB" />
  <circle cx="50" cy="78" r="16.5" fill="#EF4444" />
  <circle cx="22" cy="50" r="16.5" fill="#16A34A" />

  <!-- Overlap Regions -->
  <g clip-path="url(#favCenterClip)">
    <circle cx="50" cy="22" r="16.5" fill="#84CC16" fill-opacity="0.88" />
    <circle cx="78" cy="50" r="16.5" fill="#1E3A8A" fill-opacity="0.88" />
    <circle cx="50" cy="78" r="16.5" fill="#991B1B" fill-opacity="0.88" />
    <circle cx="22" cy="50" r="16.5" fill="#0D9488" fill-opacity="0.88" />
  </g>
</svg>
